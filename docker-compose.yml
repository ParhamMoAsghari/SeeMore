# seemore — the whole stack in one compose file.
#
#   cp .env.example .env && chmod 600 .env     # fill in the values (every variable is documented there)
#   make bootstrap                             # network, directories, permissions (see Makefile / install.sh)
#   docker compose up -d                       # everything selected by COMPOSE_PROFILES in .env
#
# Profiles (COMPOSE_PROFILES in .env, or --profile on the command line):
#   (none)  seemore core (bot + API + panel + job engine + link server) and its restricted Docker proxy — always on
#   media   Jellyfin, Seerr, Radarr, Sonarr, Prowlarr, qBittorrent, Bazarr, FlareSolverr
#   subfa   automatic Persian subtitles (Bazarr first, subf2m fallback)
#   proxy   Caddy reverse proxy with automatic HTTPS (panel + download links + your other sites)
# Leave a profile out when you already run that service elsewhere and point the *_URL variables at it.
# USB auto-mount and the settings helper are host components (udev/systemd): `sudo make host` (host/install.sh).
#
# Region-specific workarounds (TMDB blocking, registry mirrors) live in compose/iran.yml; enable them with
# COMPOSE_FILE=docker-compose.yml:compose/iran.yml in .env (see docs/iran.md).
name: ${COMPOSE_PROJECT_NAME:-seemore}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-lsio: &lsio
  restart: always
  profiles: [media]
  environment: &lsio-env
    PUID: "${SEEMORE_UID:-1000}"
    PGID: "${SEEMORE_GID:-1000}"
    TZ: ${TZ:-UTC}
  networks: [media]
  logging: *logging

services:
  # ---------------------------------------------------------------- seemore core
  seemore:
    image: ${SEEMORE_IMAGE:-seemore:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        WITH_RAR: ${WITH_RAR:-1}
    container_name: ${SEEMORE_CONTAINER:-seemore}
    restart: always
    user: "${SEEMORE_UID:-1000}:${SEEMORE_GID:-1000}"
    env_file: [.env]          # secrets + defaults; values saved in the panel (SQLite) take precedence
    environment:
      TZ: ${TZ:-UTC}
      STATE_FILE: /state/state.json
      DB_FILE: /state/bot.db
      PORT: "3000"
      DL_PORT: ${DL_PORT:-3001}
      API_PORT: ${API_PORT:-3002}
      CTL_DIR: /seemorectl
      USB_CTL: /usbctl
      USB_ROOT: /media/usb
      DOCKER_PROXY: http://seemore-docker-proxy:2375
      SELF_CONTAINER: ${SEEMORE_CONTAINER:-seemore}
      SELF_HOST: ${SEEMORE_CONTAINER:-seemore}
      CADDY_SNIPPET: /ext/caddy/seemore.caddy
      SUBFA_OVERRIDES: /ext/subfa/overrides.json
      PUID: ${SEEMORE_UID:-1000}
    ports:
      # Optional direct binding of the panel/API on the host. Loopback/private IPs only: Docker-published ports
      # bypass host firewalls (ufw). Public access goes through Caddy.
      - "${SEEMORE_PANEL_BIND:-127.0.0.1:8098}:${API_PORT:-3002}"
    volumes:
      - ${SEEMORE_STATE_DIR:-./state}/seemore:/state
      - ${SEEMORE_DATA:-/data}:/data
      - ${SEEMORE_USB_ROOT:-/media/usb}:/media/usb:rslave
      - ${SEEMORE_USBCTL:-/run/usb-automount}:/usbctl
      - ${SEEMORE_CTL:-/run/seemore-ctl}:/seemorectl
      - ${SEEMORE_STATE_DIR:-./state}/caddy-sites:/ext/caddy
      - ${SEEMORE_STATE_DIR:-./state}/subfa:/ext/subfa
    networks: [media, seemore-docker]
    depends_on: [docker-proxy]
    mem_limit: ${SEEMORE_MEM_LIMIT:-512m}
    stop_grace_period: 20s
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null && wget -qO- http://127.0.0.1:$${API_PORT:-3002}/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Restricted Docker API for seemore: list/inspect containers, read logs, restart. No exec/create/images/POST
  # beyond restart. Reachable only on the internal network shared with seemore.
  docker-proxy:
    image: ${SOCKET_PROXY_IMAGE:-lscr.io/linuxserver/socket-proxy:latest}
    container_name: seemore-docker-proxy
    restart: always
    environment:
      CONTAINERS: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_LOGS: "1"
      POST: "0"
      EVENTS: "0"
      PING: "1"
      VERSION: "1"
      LOG_LEVEL: warning
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run]
    networks: [seemore-docker]
    mem_limit: 64m
    logging: *logging

  # ---------------------------------------------------------------- media services (profile: media)
  jellyfin:
    <<: *lsio
    image: ${JELLYFIN_IMAGE:-lscr.io/linuxserver/jellyfin:latest}
    container_name: jellyfin
    ports: ["${JELLYFIN_BIND:-127.0.0.1}:${JELLYFIN_PORT:-8096}:8096"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/jellyfin:/config", "${SEEMORE_DATA:-/data}:/data"]

  jellyseerr:
    image: ${SEERR_IMAGE:-ghcr.io/seerr-team/seerr:latest}
    container_name: jellyseerr
    profiles: [media]
    restart: always
    user: "${SEEMORE_UID:-1000}:${SEEMORE_GID:-1000}"
    init: true
    environment: { TZ: "${TZ:-UTC}", LOG_LEVEL: info }
    networks: [media]
    ports: ["${SEERR_BIND:-127.0.0.1}:${SEERR_PORT:-5055}:5055"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/jellyseerr:/app/config"]
    logging: *logging

  radarr:
    <<: *lsio
    image: ${RADARR_IMAGE:-lscr.io/linuxserver/radarr:latest}
    container_name: radarr
    ports: ["127.0.0.1:${RADARR_PORT:-7878}:7878"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/radarr:/config", "${SEEMORE_DATA:-/data}:/data"]

  sonarr:
    <<: *lsio
    image: ${SONARR_IMAGE:-lscr.io/linuxserver/sonarr:latest}
    container_name: sonarr
    ports: ["127.0.0.1:${SONARR_PORT:-8989}:8989"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/sonarr:/config", "${SEEMORE_DATA:-/data}:/data"]

  prowlarr:
    <<: *lsio
    image: ${PROWLARR_IMAGE:-lscr.io/linuxserver/prowlarr:latest}
    container_name: prowlarr
    ports: ["127.0.0.1:${PROWLARR_PORT:-9696}:9696"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/prowlarr:/config"]

  qbittorrent:
    <<: *lsio
    image: ${QBIT_IMAGE:-lscr.io/linuxserver/qbittorrent:latest}
    container_name: qbittorrent
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "${TORRENT_PORT:-6881}"
    ports:
      - "127.0.0.1:${QBIT_WEBUI_PORT:-8080}:8080"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"
    volumes: ["${SEEMORE_APPDATA:-./appdata}/qbittorrent:/config", "${SEEMORE_DATA:-/data}:/data"]

  bazarr:
    <<: *lsio
    image: ${BAZARR_IMAGE:-lscr.io/linuxserver/bazarr:latest}
    container_name: bazarr
    ports: ["127.0.0.1:${BAZARR_PORT:-6767}:6767"]
    volumes: ["${SEEMORE_APPDATA:-./appdata}/bazarr:/config", "${SEEMORE_DATA:-/data}:/data"]

  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:latest}
    container_name: flaresolverr
    profiles: [media]
    restart: always
    environment: { TZ: "${TZ:-UTC}", LOG_LEVEL: info }
    networks: [media]
    ports: ["127.0.0.1:${FLARESOLVERR_PORT:-8191}:8191"]
    logging: *logging

  # ---------------------------------------------------------------- subtitles (profile: subfa)
  subfa:
    # Python stdlib service; reuses the Bazarr image (python 3.12 + unrar) so no extra image is pulled.
    image: ${SUBFA_IMAGE:-lscr.io/linuxserver/bazarr:latest}
    container_name: subfa
    profiles: [subfa]
    restart: always
    entrypoint: ["/lsiopy/bin/python3", "-u", "/app/subfa.py"]
    user: "${SEEMORE_UID:-1000}:${SEEMORE_GID:-1000}"
    env_file: [.env]          # *arr/Bazarr keys, Jellyfin login, HOOK_KEY, SUBFA_HOOK_KEY
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${SEEMORE_UID:-1000}
      PGID: ${SEEMORE_GID:-1000}
      STATE_FILE: /state/state.json
      SUBFA_OVERRIDES: /state/overrides.json
      BOT_URL: http://${SEEMORE_CONTAINER:-seemore}:3000
      POLL_SECONDS: ${SUBFA_POLL_SECONDS:-180}
      SWEEP_SECONDS: ${SUBFA_SWEEP_SECONDS:-21600}
      BAZARR_GRACE: ${SUBFA_BAZARR_GRACE:-900}
      BACKOFF_HOURS: ${SUBFA_BACKOFF_HOURS:-6,12}
      SUBF2M_GAP: ${SUBFA_SUBF2M_GAP:-8}
      NOTIFY: ${SUBFA_NOTIFY:-1}
    volumes:
      - ./subfa/app:/app:ro
      - ${SEEMORE_STATE_DIR:-./state}/subfa:/state
      - ${SEEMORE_DATA:-/data}:/data
    networks: [media]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD", "/lsiopy/bin/python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------- reverse proxy (profile: proxy)
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: ${CADDY_CONTAINER:-caddy}
    profiles: [proxy]
    restart: always
    env_file: [.env]          # e.g. CLOUDFLARE_API_TOKEN for DNS challenges (custom Caddy image)
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443", "${HTTPS_PORT:-443}:443/udp"]
    volumes:
      - ${CADDYFILE:-./config/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${SEEMORE_STATE_DIR:-./state}/caddy-sites:/etc/caddy/seemore:ro   # site blocks generated by seemore
      - ${SEEMORE_STATE_DIR:-./state}/caddy/data:/data
      - ${SEEMORE_STATE_DIR:-./state}/caddy/config:/config
    networks: [media]
    logging: *logging

networks:
  media:
    # shared by every part of the stack (and by services from other compose projects you want to reach);
    # created once by `make bootstrap` / install.sh:  docker network create <name>
    external: true
    name: ${SEEMORE_NETWORK:-seemore}
  seemore-docker:
    internal: true
